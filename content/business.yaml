# =============================================================================
# STONELANE RENOVATIONS — single source of truth
# =============================================================================
# Change a value here and it updates everywhere on the site: header, footer,
# trust strip, schema markup, enquiry confirmations, every suburb page.
#
# Every line marked "PLACEHOLDER" is unverified invented content. Each one is
# also listed in content/TODO.md. Do not launch with any of them in place.
#
# All prices are GST inclusive. All measurements are metric.
# =============================================================================

identity:
  # PLACEHOLDER: trading name not confirmed against ASIC business name register
  name: Stonelane Renovations
  # PLACEHOLDER: legal entity name and structure unconfirmed
  legalName: Stonelane Renovations Pty Ltd
  # PLACEHOLDER: ABN invented, must match ABN Lookup before launch
  abn: "00 000 000 000"
  # Shown under the logo and in the browser tab. Keep it under 60 characters.
  descriptor: Design and construct renovations, Sydney
  # The one sentence that answers "what do you do". Used in meta description
  # and the footer. Plain language, no adjectives we cannot defend.
  positioning: >-
    Kitchens, bathrooms, extensions and whole home renovations for ordinary
    Sydney houses. Brick veneer, weatherboard, fibro and project homes built
    between the 1960s and the 1990s. Design and construct under one contract.
  # The single reason to choose us over the builder down the road.
  differentiator: >-
    A fixed price contract before demolition starts. No provisional sums, no
    allowances buried in the quote.
  # Expanded version for the homepage. Two sentences maximum.
  differentiatorLong: >-
    We price the job properly before you commit, then hold that price. Most
    renovation quotes carry provisional sums and allowances that move once the
    walls are open. Ours do not, because we do the investigation work first.
  # PLACEHOLDER: founding year invented
  established: 1000
  # PLACEHOLDER: invented
  teamSize: 00

