# Deploys the site to GitHub Pages on every push to main.
#
# This is a PREVIEW host, not the production one. The brief specifies Vercel,
# and Vercel remains the target: connect the repository at vercel.com/new and
# it auto-detects Astro with no configuration. This workflow exists so the work
# is reviewable at a URL in the meantime.
#
# GitHub Pages serves a project site from /<repo>/ rather than a domain root,
# so the build sets BASE_PATH and SITE_URL. Neither is set anywhere else, so
# every other build uses the canonical URL from content/business.yaml.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer commit finish rather than
# cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # enablement: true turns Pages on for the repository if it is not already,
      # so this works without anyone changing a repository setting by hand.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
